version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: investment
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # 主機 5433 對應容器 5432
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Laravel (backend)
  backend:
    build:
      context: .
      dockerfile: ./.docker-env/api/Dockerfile
    container_name: laravel-app
    restart: on-failure
    volumes:
      - ./api:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432  # 容器內部使用標準 5432
      - DB_DATABASE=investment
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
    command: bash -c "if [ ! -f composer.json ]; then composer create-project --prefer-dist laravel/laravel .; fi && composer install && php-fpm"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  # Nuxt.js (frontend)
  frontend:
    build:
      context: ./web
      dockerfile: ../.docker-env/web/Dockerfile
    container_name: nuxt-app
    restart: unless-stopped
    stdin_open: true
    tty: true
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.nuxt
    ports:
      - "3000:3000"
      - "24678:24678"  # Nuxt HMR port
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "if [ ! -f package.json ]; then nuxi init . --force; fi && npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    networks:
      - app-network

  # Nginx for serving Laravel and Nuxt
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "8000:80"  # Laravel API 用 8000 port
    volumes:
      - ./.docker-env/nginx/api.conf:/etc/nginx/conf.d/default.conf
      - ./api:/var/www/html
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: